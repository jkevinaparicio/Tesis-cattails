# Base de datos (Railway u otro proveedor, vía variables de entorno)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=false

# Frontend (URL real desplegada, ej. Vercel/Netlify)
app.frontend-url=${APP_FRONTEND_URL}

spring.security.oauth2.client.registration.google.redirect-uri=https://backennd-production-d734.up.railway.app/login/oauth2/code/google

# CORS
app.allowed-origins=${APP_ALLOWED_ORIGINS}
